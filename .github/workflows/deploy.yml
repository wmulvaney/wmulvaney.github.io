name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Create .env file
      run: |
        echo "VITE_YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
        
    - name: Install Dependencies
      run: npm install
      
    - name: Check vite binary
      run: ls -la node_modules
    - name: Generate Substack feed JSON
      # Substack 403s GitHub's datacenter IPs; fall back to the committed feed JSON
      run: node scripts/generate-substack-feed.mjs || echo "Feed generation failed, using committed public/substack-feed.json"
    - name: Build with Vite directly
      run: node node_modules/vite/bin/vite.js build
    
    - name: Setup 404.html and .nojekyll for SPA routing
      run: |
        echo 'williammulvaney.com' > dist/CNAME
        cp dist/index.html dist/404.html
        mkdir -p dist/book
        cp dist/index.html dist/book/index.html
        touch dist/.nojekyll
        
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@4.1.5
      with:
        branch: gh-pages
        folder: dist 
