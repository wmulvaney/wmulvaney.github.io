<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b16" />
  <meta name="description" content="RISE — live the life of an athlete. Your real sleep and recovery decide how far your career goes: from backyard games to the pros." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RISE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>RISE — The Athlete's Journey</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="era-youth">
  <div id="app" aria-live="polite">
    <div class="boot-splash">
      <div class="boot-mark">
        <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
          <defs>
            <linearGradient id="bootg" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <path d="M8 52 L24 30 L34 40 L56 10" fill="none" stroke="url(#bootg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="56" cy="10" r="5.5" fill="#ffd166"/>
        </svg>
      </div>
      <h1>RISE</h1>
      <p>Sleep. Recover. Become.</p>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
