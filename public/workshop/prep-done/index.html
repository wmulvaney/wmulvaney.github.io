<style>
  :root {
    --bg: #040b12;
    --surface: rgba(10, 26, 39, 0.72);
    --card-2: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.1);
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.32);
    --accent: #479dc2;
    --accent-press: #3a7e9b;
    --ok: #4ade80;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-ui: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; position: relative; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 70% 45% at 75% -10%, rgba(71, 157, 194, 0.14), transparent 60%),
      radial-gradient(ellipse 55% 40% at 10% 110%, rgba(71, 157, 194, 0.07), transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
  .home-link { display: inline-block; margin: 0 0 34px; }
  .home-link img { height: 42px; width: auto; display: block; opacity: 0.9; filter: brightness(0) invert(1); }
  .done-ic { font-size: 40px; color: var(--ok); margin-bottom: 10px; }
  .kicker { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(71, 157, 194, 0.9); margin-bottom: 12px; }
  h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 5vw, 40px); line-height: 1.12; color: #fff; margin: 0 0 14px; }
  .lede { color: var(--muted); font-size: 15.5px; line-height: 1.7; margin: 0 0 26px; }
  .btn {
    font-family: var(--font-ui); cursor: pointer; border: 1px solid transparent;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 16px 28px; display: block; text-decoration: none; text-align: center; transition: all 160ms ease;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-press); border-color: var(--accent-press); }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 22px 22px; margin-top: 34px; }
  .card p { margin: 0 0 14px; font-size: 14px; line-height: 1.65; color: var(--muted); }
  .card b { color: var(--text); }
  .card.cross { display: flex; gap: 18px; align-items: flex-start; }
  .card.cross img { width: 96px; height: 124px; object-fit: cover; object-position: 50% 22%; flex: none; border: 1px solid var(--border); }
  .small-link { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .small-link:hover { color: #fff; }
  footer { margin-top: 60px; text-align: center; color: var(--faint); font-size: 11px; letter-spacing: 0.1em; }
</style>

  <div class="done-ic" id="ic">✓</div>
